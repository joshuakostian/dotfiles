background {
    monitor =
    path = screenshot        # blurred screenshot of your desktop; or use a path to an image
    blur_passes = 3
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 0
    rounding = 0
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgba(0, 0, 0, 0)
    fail_color = rgba(0, 0, 0, 0)
    font_color = rgb(255, 255, 255)
    placeholder_text =
    fade_on_empty = false
    dots_text_format = *
    font_family = Iosevka SS08
    position = 0, -80
    halign = center
    valign = center
}

shape {
    monitor =
    size = 250, 2
    color = rgb(255, 255, 255)
    rounding = 0
    position = 0, -105
    halign = center
    valign = center
}

label {
    monitor =
    text = >
    font_size = 24
    font_family = Iosevka SS08
    position = -150, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = Iosevka SS08
    position = 0, 80
    halign = center
    valign = center
}
